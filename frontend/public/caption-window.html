<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>S2T 即時字幕</title></head><body style="margin:0;background:#080808;color:white">正在載入字幕…</body><script>(function () {
  var messages = {
    'zh-TW': { lang: 'zh-TW', title: 'S2T 即時字幕', body: '正在載入字幕…' },
    'zh-CN': { lang: 'zh-CN', title: 'S2T 实时字幕', body: '正在加载字幕…' },
    en: { lang: 'en', title: 'S2T Live Captions', body: 'Loading captions…' },
    ja: { lang: 'ja', title: 'S2T リアルタイム字幕', body: '字幕を読み込み中…' },
    de: { lang: 'de', title: 'S2T Live-Untertitel', body: 'Untertitel werden geladen …' }
  }
  var tag = (navigator.language || 'en').toLowerCase()
  var key = tag.indexOf('zh') === 0 ? (tag.indexOf('hans') >= 0 || tag.indexOf('cn') >= 0 ? 'zh-CN' : 'zh-TW')
    : tag.indexOf('ja') === 0 ? 'ja'
    : tag.indexOf('de') === 0 ? 'de'
    : tag.indexOf('en') === 0 ? 'en'
    : 'en'
  var text = messages[key]
  document.documentElement.lang = text.lang
  document.title = text.title
  document.body.textContent = text.body
})()</script></html>
