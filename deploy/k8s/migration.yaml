apiVersion: batch/v1
kind: Job
metadata:
  name: s2t-schema-migration
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: s2t-ui
          command: [node, scripts/storage/migrate-schema.cjs]
          envFrom:
            - secretRef: {name: s2t-secrets}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {memory: "256Mi"}
