apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2t-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s2t-frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: s2t-frontend
    spec:
      containers:
      - name: nginx
        image: s2t-frontend
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        readinessProbe:
          httpGet:
            path: /livez
            port: http
        livenessProbe:
          httpGet:
            path: /livez
            port: http
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: s2t-frontend-nginx
---
