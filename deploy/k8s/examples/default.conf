server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    location = /livez { access_log off; return 200 'ok'; }
    # In Kubernetes the ingress sends /api directly to the API Service.
    location = /api { return 404; }
    location /api/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
