apiVersion: v1
kind: ConfigMap
metadata:
  name: s2t-runtime
data:
  S2T_KUBERNETES_MODE: "true"
  S2T_STORAGE_MIGRATIONS: "verify"
  S2T_WEB_PORT: "8787"
  S2T_SHUTDOWN_GRACE_MS: "45000"
  S2T_POSTGRES_MAX_CONNECTIONS: "4"
  S2T_MODELS_DIR: /models
  S2T_ASR_MAX_INFLIGHT: "64"
  S2T_TRANSLATION_MAX_INFLIGHT: "64"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2t-gateway
spec:
  replicas: 2
  selector:
    matchLabels: {app: s2t-gateway}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: s2t-gateway}
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: s2t-gateway}
      containers:
        - name: app
          image: s2t-ui
          ports: [{containerPort: 8787, name: http}]
          envFrom:
            - configMapRef: {name: s2t-runtime}
            - secretRef: {name: s2t-secrets}
          env:
            - {name: S2T_PROCESS_ROLE, value: api}
            - {name: S2T_AUDIO_SERVICE_URL, value: "http://s2t-audio-service:8787"}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits: {memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: s2t-gateway
spec:
  selector: {app: s2t-gateway}
  ports: [{port: 8787, targetPort: http, name: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: s2t-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: s2t-gateway}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2t-audio-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: s2t-audio-service}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: s2t-audio-service}
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: s2t-audio-service}
      containers:
        - name: app
          image: s2t-ui
          ports: [{containerPort: 8787, name: http}]
          envFrom:
            - configMapRef: {name: s2t-runtime}
            - secretRef: {name: s2t-secrets}
          env:
            - {name: S2T_PROCESS_ROLE, value: audio-service}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: "1000m", memory: "2Gi"}
            limits: {memory: "4Gi"}
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: s2t-models}
---
apiVersion: v1
kind: Service
metadata:
  name: s2t-audio-service
spec:
  selector: {app: s2t-audio-service}
  ports: [{port: 8787, targetPort: http, name: http}]
---
apiVersion: policy/v1
