apiVersion: v1
data:
  S2T_ASR_MAX_INFLIGHT: "64"
  S2T_KUBERNETES_MODE: "true"
  S2T_MODELS_DIR: /models
  S2T_POSTGRES_MAX_CONNECTIONS: "4"
  S2T_SHUTDOWN_GRACE_MS: "45000"
  S2T_STORAGE_MIGRATIONS: verify
  S2T_TRANSLATION_MAX_INFLIGHT: "64"
  S2T_WEB_PORT: "8787"
kind: ConfigMap
metadata:
  name: s2t-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: s2t-audio-service
spec:
  ports:
  - name: http
    port: 8787
    targetPort: http
  selector:
    app: s2t-audio-service
---
apiVersion: v1
kind: Service
metadata:
  name: s2t-gateway
spec:
  ports:
  - name: http
    port: 8787
    targetPort: http
  selector:
    app: s2t-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2t-audio-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s2t-audio-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: s2t-audio-service
    spec:
      containers:
      - env:
        - name: S2T_PROCESS_ROLE
          value: audio-service
        envFrom:
        - configMapRef:
            name: s2t-runtime
        - secretRef:
            name: s2t-secrets
        image: YOUR_REGISTRY/s2t-ui:REPLACE_WITH_IMMUTABLE_TAG
        lifecycle:
          preStop:
            exec:
              command:
              - node
              - -e
              - process.kill(1, "SIGUSR2"); setTimeout(() => {}, 10000)
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
        name: app
        ports:
        - containerPort: 8787
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: 1000m
            memory: 2Gi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: s2t-audio-service
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: s2t-models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2t-audio-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s2t-audio-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: s2t-audio-worker
    spec:
      containers:
      - env:
        - name: S2T_PROCESS_ROLE
          value: audio-worker
        envFrom:
        - configMapRef:
            name: s2t-runtime
        - secretRef:
            name: s2t-secrets
        image: YOUR_REGISTRY/s2t-ui:REPLACE_WITH_IMMUTABLE_TAG
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
        name: app
        ports:
        - containerPort: 8787
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: 1000m
            memory: 2Gi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: s2t-audio-worker
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: s2t-models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2t-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s2t-gateway
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: s2t-gateway
    spec:
      containers:
      - env:
        - name: S2T_PROCESS_ROLE
          value: api
        - name: S2T_AUDIO_SERVICE_URL
          value: http://s2t-audio-service:8787
        envFrom:
        - configMapRef:
            name: s2t-runtime
        - secretRef:
            name: s2t-secrets
        image: YOUR_REGISTRY/s2t-ui:REPLACE_WITH_IMMUTABLE_TAG
        lifecycle:
          preStop:
            exec:
              command:
              - node
              - -e
              - process.kill(1, "SIGUSR2"); setTimeout(() => {}, 10000)
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
        name: app
        ports:
        - containerPort: 8787
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: s2t-gateway
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: s2t-audio-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: s2t-audio-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: s2t-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: s2t-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: s2t-audio-service
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 65
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: s2t-audio-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: s2t-audio-worker
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  maxReplicas: 4
  metrics:
  - object:
      describedObject:
        apiVersion: v1
        kind: Service
        name: s2t-gateway
      metric:
        name: s2t_diarization_pending_audio_seconds
      target:
        averageValue: "120"
        type: AverageValue
    type: Object
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: s2t-audio-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: s2t-gateway
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  maxReplicas: 6
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 65
        type: Utilization
    type: Resource
  - pods:
      metric:
        name: s2t_gateway_inflight_requests
      target:
        averageValue: "16"
        type: AverageValue
    type: Pods
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: s2t-gateway
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s2t-schema-migration
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 2
  template:
    spec:
      containers:
      - command:
        - node
        - scripts/storage/migrate-schema.cjs
        envFrom:
        - secretRef:
            name: s2t-secrets
        image: YOUR_REGISTRY/s2t-ui:REPLACE_WITH_IMMUTABLE_TAG
        name: migration
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Never
  ttlSecondsAfterFinished: 86400
