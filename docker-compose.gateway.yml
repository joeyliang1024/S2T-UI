name: s2t-gateway
services:
  gateway:
    image: s2t-ui:nemotron-cpu-local
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:?Set NPM_REGISTRY to your approved registry}
    env_file:
      - .env
    environment:
      # Container paths override the host-relative values in .env.
      S2T_MODELS_DIR: /models
      S2T_LOCAL_DATA_DIR: /data
      S2T_WEB_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./models:/models:ro
      - gateway-data:/data
    restart: unless-stopped
volumes:
  gateway-data:
